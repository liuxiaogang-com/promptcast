# GitHub 负责构建签名和公开 Release；CNB 主动拉取后发布日志与更新清单。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建/发布 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：通用二进制（一份 dmg 同时覆盖 Apple Silicon 与 Intel）。
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Windows：NSIS setup.exe + MSI。
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Linux 不构建：更新器未覆盖，且 enigo 在 Linux 需 libxdo，价值低，按需再加。

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Require a version tag
        shell: bash
        run: '[[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11 # 与本地锁文件（lockfileVersion 9.0 / allowBuilds 语法）一致

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 要求 Node ≥ 22.13；与本地（Node 24 / pnpm 11）一致
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # 固定 shared-key：与 warm-cache.yml 共享缓存前缀，且让发版构建能命中
          # main 上预热好的缓存（OS 已自动计入 key，故各平台仍各自独立）。
          shared-key: "tauri-release"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # macOS 代码签名（自签名证书）：导入 .p12 到临时钥匙串并标记为受信任的代码签名根，
      # 使 codesign 能用该身份。目的是让签名身份跨版本稳定，从而更新后辅助功能(TCC)授权不丢失。
      # 自签名非 Apple 公证，Gatekeeper 首次打开仍需右键「打开」（不影响授权保留）。
      - name: Setup macOS signing keychain
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "未配置签名证书，跳过（产物将为 ad-hoc 未签名）"; exit 0
          fi
          P12="$RUNNER_TEMP/pc.p12"
          PEM="$RUNNER_TEMP/pc.pem"
          KC="$RUNNER_TEMP/pc-signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          openssl pkcs12 -in "$P12" -clcerts -nokeys -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -out "$PEM"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          # 把新钥匙串加入用户搜索列表（保留原有），并设为默认，供 codesign 查找身份
          EXISTING="$(security list-keychains -d user | sed 's/[\" ]//g' | tr '\n' ' ')"
          security list-keychains -d user -s "$KC" $EXISTING
          security default-keychain -s "$KC"
          # 自签名必须显式信任为代码签名根，否则 codesign 报「no identity found」
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$PEM"
          echo "--- 可用代码签名身份 ---"
          security find-identity -v -p codesigning "$KC"

      - name: Build app & upload to release (draft)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 用此身份签名（Windows 忽略）。空则不签名。
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PromptCast ${{ github.ref_name }}"
          releaseBody: "安装包构建完成后自动补充版本日志。"
          # 草稿：两平台产物传齐、由 publish job 校验后再发布，避免半成品 Release 外泄。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 两平台都成功后上传同步元数据，最后公开 Release；GitHub 无需 CNB 密钥。
  publish:
    concurrency:
      group: release-index
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download built assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" -D assets --clobber

      - name: Prepare release metadata
        run: node scripts/prepare-release.mjs

      - name: Upload metadata and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" release.json --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --notes-file "releases/${GITHUB_REF_NAME}.md" --draft=false --latest

      - name: Publish static release index
        run: |
          set -euo pipefail
          node scripts/publish-release-index.mjs
